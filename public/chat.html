<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Chat</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	</head>
	<body>
		<div class="container">

			<div class="row mt-5">
				<div class="col-sm-6">
					<h3>Send Message</h3>
					<hr>
					<input
						type="text"
						id="txtID"
						class="form-control mb-2"
						placeholder="id"
						autocomplete="off">
					<input
						type="text"
						id="txtMessage"
						class="form-control mb-2"
						placeholder="message"
						autocomplete="off">
						<br>
						<h3>Users</h3>
						<hr>
						<ul id="ulUsers">

						</ul>
				</div>

				<div class="col-sm-6">
					<h3>Messages</h3>
					<ul id="ulMessages">
						
					</ul>
					<hr>
				</div>
				<button id="btnExit" class="btn btn-outline-danger">Logout</button>
			</div>
		</div>
		<script src="/socket.io/socket.io.js"></script> 
		<script src="/js/chat.js"></script>
	</body>
</html>
