<!DOCTYPE html>
<html lang="en">

	<head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<title>Sign In</title>
		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	</head>

	<body>
		<div class="container">
			<div class="row">
				<div class="col-mt-5">
					<h1>Google Sign In</h1>
					<hr>
					<div id="g_id_onload" data-client_id="191543386596-hv6v7t6v705v944gojs8jqddpf0f6ok3.apps.googleusercontent.com"
						data-auto_prompt="false" data-callback="googleLogin">
					</div>
					<br>
					<div class="g_id_signin" data-type="standard" data-size="large" data-theme="outline" data-text="sign_in_with"
						data-shape="rectangular" data-logo_alignment="left">
					</div>

					<br>
					<button onclick="signOut()" class="btn btn-primary mb-2">Sign out</button>
				</div>
				<div class="col-mt-5">
					<h1>Login</h1>
					<hr>
					<form class="d-grid">
						<input type="text" name="email" class="form-control mb-2" placeholder="Email">
						<input type="password" name="password" class="form-control mb-2" placeholder="Password">
						<button type="submit" class="btn btn-primary">Login</button>
					</form>
				</div>
			</div>
			<hr>
		</div>



		<script src="https://accounts.google.com/gsi/client" async></script>
		<script src="/js/auth.js"></script>

	<body>

</html>
