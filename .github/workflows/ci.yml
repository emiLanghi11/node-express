name: CI

on: 
  push:
    branches:
      - main

jobs:

  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v2
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm install
    - name: lint the project
      run: npm run lint
    - name: Build the project
      run: npm run build
    - name: Hello world
      run: echo "Hello, world!"
    - name: Tell me the date
      run: date
    - name: Show me the current directory
      run: ls -la